<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background: warm dark obsidian with warm glow -->
  <rect width="1200" height="630" fill="#141210"/>
  
  <defs>
    <radialGradient id="purpleglow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 240) rotate(90) scale(400 600)">
      <stop stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#141210" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#purpleglow)"/>

  <!-- Brand Icon Badge -->
  <g transform="translate(600, 140)">
    <rect x="-38" y="-38" width="76" height="76" rx="16" fill="#1E1B18" stroke="#9D68F7" stroke-width="2.5"/>
    <!-- Notebook mini icon -->
    <rect x="-18" y="-22" width="36" height="44" rx="5" fill="#25221F" stroke="#F0EAE0" stroke-width="2"/>
    <line x1="-8" y1="-22" x2="-8" y2="22" stroke="#9D68F7" stroke-width="2"/>
    <line x1="-2" y1="-10" x2="10" y2="-10" stroke="#F0EAE0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-2" y1="-2" x2="10" y2="-2" stroke="#F0EAE0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-2" y1="6" x2="6" y2="6" stroke="#9D68F7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Title: Rough Notebook -->
  <text x="600" y="270" text-anchor="middle" fill="#F0EAE0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.03em">
    Rough <tspan fill="url(#purpleGrad)">Notebook</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="325" text-anchor="middle" fill="#A78BFA" font-family="ui-monospace, JetBrains Mono, monospace" font-size="22" font-weight="600" letter-spacing="0.04em">
    THINK IT. TRACE IT. SOLVE IT.
  </text>

  <!-- Subtitle -->
  <text x="600" y="375" text-anchor="middle" fill="#A89E94" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="500">
    Keyboard-first digital scratch pad for DSA, algorithms, and coding interviews
  </text>

  <!-- DSA Array Preview Graphic -->
  <g transform="translate(420, 435)">
    <!-- Cell 0 -->
    <rect x="0" y="0" width="80" height="70" rx="8" fill="#1E1B18" stroke="#9D68F7" stroke-width="2"/>
    <text x="40" y="36" text-anchor="middle" fill="#F0EAE0" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700">2</text>
    <text x="40" y="58" text-anchor="middle" fill="#A78BFA" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">[0]</text>
    
    <!-- Cell 1 -->
    <rect x="92" y="0" width="80" height="70" rx="8" fill="#1E1B18" stroke="#38332E" stroke-width="1.5"/>
    <text x="132" y="36" text-anchor="middle" fill="#F0EAE0" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700">7</text>
    <text x="132" y="58" text-anchor="middle" fill="#756D65" font-family="JetBrains Mono, monospace" font-size="12">[1]</text>
    
    <!-- Cell 2 -->
    <rect x="184" y="0" width="80" height="70" rx="8" fill="#1E1B18" stroke="#38332E" stroke-width="1.5"/>
    <text x="224" y="36" text-anchor="middle" fill="#F0EAE0" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700">11</text>
    <text x="224" y="58" text-anchor="middle" fill="#756D65" font-family="JetBrains Mono, monospace" font-size="12">[2]</text>
    
    <!-- Cell 3 -->
    <rect x="276" y="0" width="80" height="70" rx="8" fill="#1E1B18" stroke="#38332E" stroke-width="1.5"/>
    <text x="316" y="36" text-anchor="middle" fill="#F0EAE0" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700">15</text>
    <text x="316" y="58" text-anchor="middle" fill="#756D65" font-family="JetBrains Mono, monospace" font-size="12">[3]</text>
  </g>

  <!-- Footer repo -->
  <text x="600" y="565" text-anchor="middle" fill="#8C8278" font-family="ui-monospace, JetBrains Mono, monospace" font-size="16" letter-spacing="0.04em">
    github.com/shambhoo-narwaria/Rough-Notebook
  </text>
</svg>
