<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Jet Black Velvet Gradient -->
    <radialGradient id="favJetBlack" cx="256" cy="140" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141219"/>
      <stop offset="35%" stop-color="#0C0A10"/>
      <stop offset="75%" stop-color="#060508"/>
      <stop offset="100%" stop-color="#020103"/>
    </radialGradient>

    <!-- Ultra-Premium Luminous Amethyst to Electric Violet Gradient -->
    <linearGradient id="favWave" x1="130" y1="345" x2="385" y2="315" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6B21A8"/>
      <stop offset="22%" stop-color="#7C3AED"/>
      <stop offset="55%" stop-color="#9333EA"/>
      <stop offset="82%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>

    <!-- Multi-stage Photorealistic Glow Filter -->
    <filter id="favGlow" x="80" y="240" width="370" height="200" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="deepBloom"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="sharpBloom"/>
      <feMerge>
        <feMergeNode in="deepBloom"/>
        <feMergeNode in="sharpBloom"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Apple Continuous Curvature Squircle Base (Deep Jet Black, 100% Borderless) -->
  <rect width="512" height="512" rx="114" fill="url(#favJetBlack)"/>

  <!-- 2. Inner Page Top Header Outline (Crisp White) -->
  <path d="M 98 116 C 98 86 118 76 144 76 L 368 76 C 394 76 414 86 414 116 L 414 130"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.75"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- 3. Left Spine Vertical Cord + 3 Ring Nodes (Crisp White) -->
  <line x1="104" y1="112" x2="104" y2="392" stroke="#FFFFFF" stroke-opacity="0.90" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Node 1 -->
  <circle cx="104" cy="138" r="8" fill="#0A090E" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="104" cy="138" r="3.2" fill="#FFFFFF"/>

  <!-- Node 2 -->
  <circle cx="104" cy="240" r="8" fill="#0A090E" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="104" cy="240" r="3.2" fill="#FFFFFF"/>

  <!-- Node 3 -->
  <circle cx="104" cy="342" r="8" fill="#0A090E" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="104" cy="342" r="3.2" fill="#FFFFFF"/>

  <!-- 4. Top Ruled Drafting Lines (Crisp White) -->
  <line x1="144" y1="144" x2="350" y2="144" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="144" y1="172" x2="292" y2="172" stroke="#FFFFFF" stroke-opacity="0.70" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 5. Floating Frosted Glass Array Cells (Crisp White [ — ] [ — ] [ — ]) -->
  <g transform="translate(146, 206)">
    <!-- Cell 0 -->
    <rect width="66" height="66" rx="18" fill="rgba(255, 255, 255, 0.08)" stroke="#FFFFFF" stroke-opacity="0.90" stroke-width="3"/>
    <line x1="22" y1="33" x2="44" y2="33" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

    <!-- Cell 1 -->
    <g transform="translate(84, 0)">
      <rect width="66" height="66" rx="18" fill="rgba(255, 255, 255, 0.08)" stroke="#FFFFFF" stroke-opacity="0.90" stroke-width="3"/>
      <line x1="22" y1="33" x2="44" y2="33" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Cell 2 -->
    <g transform="translate(168, 0)">
      <rect width="66" height="66" rx="18" fill="rgba(255, 255, 255, 0.08)" stroke="#FFFFFF" stroke-opacity="0.90" stroke-width="3"/>
      <line x1="22" y1="33" x2="44" y2="33" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 6. Fluid Stylus Trace Wave (Premium High-Contrast Jewel Violet Ink) -->
  <g filter="url(#favGlow)">
    <!-- Deep royal purple aura -->
    <path d="M 134 340 C 154 314 174 308 198 312 C 230 318 240 366 270 366 C 304 366 334 300 376 322"
          fill="none"
          stroke="#7C3AED"
          stroke-width="30"
          stroke-linecap="round"
          stroke-opacity="0.45"/>

    <!-- Vivid electric violet ambient glow -->
    <path d="M 134 340 C 154 314 174 308 198 312 C 230 318 240 366 270 366 C 304 366 334 300 376 322"
          fill="none"
          stroke="#9333EA"
          stroke-width="22"
          stroke-linecap="round"
          stroke-opacity="0.65"/>

    <!-- Core luminous amethyst-to-lilac wave -->
    <path d="M 134 340 C 154 314 174 308 198 312 C 230 318 240 366 270 366 C 304 366 334 300 376 322"
          fill="none"
          stroke="url(#favWave)"
          stroke-width="17"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Precision diamond specular crest -->
    <path d="M 142 338 C 160 316 178 312 200 314 C 230 320 240 364 270 364 C 302 364 332 304 370 322"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="3.2"
          stroke-linecap="round"
          stroke-opacity="0.85"/>
  </g>

  <!-- Glowing Stylus Tip -->
  <circle cx="376" cy="322" r="17" fill="#9333EA" fill-opacity="0.50"/>
  <circle cx="376" cy="322" r="11" fill="#C084FC" fill-opacity="0.75"/>
  <circle cx="376" cy="322" r="7" fill="#FFFFFF"/>
  <circle cx="376" cy="322" r="3.2" fill="#F5F3FF"/>

  <!-- 7. Bottom Ruled Accent Lines (Crisp White) -->
  <line x1="144" y1="398" x2="284" y2="398" stroke="#FFFFFF" stroke-opacity="0.80" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="144" y1="416" x2="240" y2="416" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round"/>
</svg>
